<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackSync App - Valigia Intelligente</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --mise-color: #fef3c7;
            --valigia-color: #dcfce7;
            --skip-color: #f8fafc;
            --buy-color: #fee2e2;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #e2e8f0;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; padding-bottom: 90px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header-app { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 1.8em; letter-spacing: -0.5px; font-weight: 800;}
        .sync-status { font-size: 0.85em; color: var(--text-muted); font-weight: 500;}

        /* Icone SVG */
        .svg-icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .svg-mini { width: 16px; height: 16px; }

        /* Menu Liste */
        .list-selector-container { background: var(--card-bg); padding: 12px 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; }
        .list-selector-container select { flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 1.05em; font-weight: 600; color: var(--text-main); background-color: #f8fafc; cursor: pointer; outline: none;}
        .list-selector-container select:focus { border-color: var(--primary); }

        /* Bagagli (Sezioni) */
        .section { background: var(--card-bg); border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); transition: opacity 0.3s; }
        .section.hidden-sec .section-body { display: none; }
        .section.hidden-sec { opacity: 0.6; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid var(--bg-color); }
        .section-header span { font-size: 1.25em; font-weight: 800; line-height: 1.2;}
        .sec-actions { display: flex; gap: 6px; }
        .icon-btn { background: #f1f5f9; border: none; border-radius: 8px; cursor: pointer; padding: 8px; color: var(--text-muted); transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: #e2e8f0; color: var(--text-main); }
        .icon-btn.danger:hover { background: #fee2e2; color: var(--danger); }

        /* Sottosezioni (Tasche, ecc) */
        .subsection { margin-top: 15px; padding-left: 12px; border-left: 3px solid var(--primary); }
        .subsection-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; margin-bottom: 12px; padding: 5px 0; }
        .subsection-title { font-size: 0.95em; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        .subsection-toggle { color: var(--text-muted); transition: transform 0.3s; }
        .subsection.collapsed .subsection-body { display: none; }
        .subsection.collapsed .subsection-toggle { transform: rotate(-90deg); }
        .subsection.collapsed { border-left-color: #cbd5e1; }

        /* Drag & Drop Styles */
        .item.dragging { opacity: 0.3; transform: scale(0.98); border: 2px dashed var(--primary); }
        .item.drag-over-item { border-top: 3px solid var(--primary); }
        .subsection-body.drag-over { background: #f1f5f9; border-radius: 8px; padding-bottom: 20px; }

        /* Oggetti */
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px; border-radius: 10px; border: 1px solid var(--border); transition: all 0.2s ease; background: #fff; gap: 15px;}
        
        .item-header { display: flex; align-items: center; flex-grow: 1; gap: 10px; overflow: hidden; }
        .drag-handle { cursor: grab; color: #cbd5e1; display: flex; align-items: center; justify-content: center; padding: 5px;}
        .drag-handle:active { cursor: grabbing; }
        .drag-handle:hover { color: var(--text-muted); }
        
        .item-name-area { display: flex; flex-direction: column; gap: 4px; flex-grow: 1;}
        .item-name { font-weight: 600; line-height: 1.3; word-break: break-word; color: var(--text-main); font-size: 0.95em;}
        
        /* Tag Da Comprare */
        .badge-buy { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7em; font-weight: 800; text-transform: uppercase; color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; padding: 3px 8px; border-radius: 20px; width: fit-content; }
        
        .item-actions { display: flex; gap: 5px; opacity: 0.4; transition: 0.2s; }
        .item:hover .item-actions { opacity: 1; }
        .action-btn { background: none; border: none; padding: 6px; cursor: pointer; color: var(--text-muted); border-radius: 6px; display: flex; align-items: center;}
        .action-btn:hover { background: #f1f5f9; color: var(--primary); }
        .action-btn.active-buy { color: var(--danger); opacity: 1; background: #fef2f2;}

        /* Colori Stati Valigia */
        .item.status-mise { background-color: var(--mise-color); border-color: #fcd34d; }
        .item.status-valigia { background-color: var(--valigia-color); border-color: #86efac; }
        .item.status-skip { background-color: var(--skip-color); opacity: 0.6; }
        .item.status-skip .item-name { text-decoration: line-through; color: #94a3b8; }
        .item.status-buy { border-color: #fca5a5; border-left: 4px solid var(--danger); }
        
        /* Controlli Checkbox (Senza Testo, Solo Emoji) */
        .controls { display: flex; gap: 8px; flex-shrink: 0;}
        .control-label { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 1.15em; cursor: pointer; user-select: none; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background-color: #f8fafc; transition: 0.1s;}
        .control-label:hover { background-color: #e2e8f0; }
        .control-label input { cursor: pointer; width: 16px; height: 16px; margin: 0; accent-color: var(--primary);}
        
        /* Sommari */
        .missing-summary { font-size: 0.9em; color: #b91c1c; margin: 20px 0 10px 0; padding: 15px; background: #fef2f2; border-radius: 10px; border-left: 4px solid #ef4444; line-height: 1.5;}
        .missing-summary strong { display: block; margin-bottom: 5px; font-size: 1.05em; color: #991b1b; }
        .missing-summary-ok { background: #f0fdf4; border-left-color: #22c55e; color: #166534; }

        /* Lista Da Comprare */
        .to-buy-summary { background: #fff1f2; border: 1px solid #fecaca; border-radius: 14px; padding: 20px; margin-top: 30px; box-shadow: var(--shadow); }
        .to-buy-summary .section-header { border-bottom-color: #fecaca; }
        .to-buy-summary .section-header span { color: #b91c1c; display: flex; align-items: center; gap: 8px;}
        .to-buy-list { padding-left: 20px; margin: 10px 0 0 0; color: #7f1d1d; line-height: 1.7; font-size: 0.95em; }
        
        /* Bottoni Aggiunta */
        .btn-add-item { background-color: transparent; color: var(--primary); width: 100%; margin-top: 5px; padding: 10px; font-size: 0.9em; border-radius: 8px; font-weight: 700; border: 2px dashed #cbd5e1; text-align: left; transition: 0.2s;}
        .btn-add-item:hover { border-color: var(--primary); background-color: #eff6ff; }
        
        .footer-actions { display: flex; justify-content: space-between; margin-top: 30px; gap: 15px;}
        .btn-main { background-color: var(--primary); color: white; border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-size: 1em; font-weight: 700; transition: 0.2s; flex-grow: 1; text-align: center;}
        .btn-main:hover { background-color: var(--primary-hover); }
        .btn-danger-main { background-color: white; color: var(--danger); border: 2px solid #fecaca; }
        .btn-danger-main:hover { background-color: #fef2f2; border-color: var(--danger);}

        /* Mobile Layout Ottimizzato */
        @media (max-width: 650px) {
            .item { flex-direction: column; align-items: stretch; gap: 12px; padding: 12px; }
            .item-actions { opacity: 1; justify-content: flex-end; }
            .controls { display: flex; justify-content: space-between; width: 100%; gap: 6px; }
            .control-label { flex: 1; padding: 10px 0; }
        }
        
        /* Modals (Popups) */
        dialog { border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); padding: 25px; max-width: 340px; width: 90%; }
        dialog::backdrop { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); }
        dialog h3 { margin-top: 0; color: var(--text-main); margin-bottom: 20px; font-size: 1.4em;}
        dialog label { font-size: 0.9em; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; display: block;}
        dialog select, dialog input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid var(--border); border-radius: 8px; font-size: 1em; box-sizing: border-box; outline: none; transition: 0.2s;}
        dialog select:focus, dialog input:focus { border-color: var(--primary); }
        
        .dialog-btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;}
        .dialog-btns button { padding: 12px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.95em; flex-grow: 1; transition: 0.2s;}
        .btn-confirm { background: var(--primary); color: white; }
        .btn-confirm:hover { background: var(--primary-hover); }
        .btn-cancel { background: #f1f5f9; color: var(--text-muted); }
        .btn-cancel:hover { background: #e2e8f0; }
        .btn-delete { background: var(--danger); color: white; }
        .btn-delete:hover { background: #dc2626; }

        .loader { border: 2px solid #f3f3f3; border-top: 2px solid var(--primary); border-radius: 50%; width: 12px; height: 12px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-app">
        <h1>PackSync App</h1>
        <div id="sync-status" class="sync-status">Caricamento in corso...</div>
    </div>

    <!-- Selettore Liste -->
    <div class="list-selector-container">
        <svg class="svg-icon" style="color:var(--primary)" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <select id="list-selector" onchange="switchList(this.value)"></select>
    </div>

    <div id="app-root"></div>
    
    <div class="footer-actions" id="footer" style="display:none;">
        <button class="btn-main" onclick="openSectionModal()">+ Nuovo Bagaglio</button>
        <button class="btn-main btn-danger-main" onclick="resetCurrentList()">Azzera Spunte</button>
    </div>
</div>

<!-- Modal Aggiungi Bagaglio -->
<dialog id="modal-section">
    <h3>Nuovo Bagaglio</h3>
    <select id="new-sec-type" onchange="checkCustomOption()">
        <option value="🎒 Zaino">🎒 Zaino</option>
        <option value="🧳 Cabina / Trolley">🧳 Cabina / Trolley</option>
        <option value="📦 Stiva / Valigia Grande">📦 Stiva / Valigia Grande</option>
        <option value="🏔️ Zaino da Montagna">🏔️ Zaino da Montagna</option>
        <option value="👜 Borsa">👜 Borsa</option>
        <option value="👝 Beauty Case">👝 Beauty Case</option>
        <option value="altro">Altro (Personalizzato)...</option>
    </select>
    <input type="text" id="new-sec-custom" placeholder="Es. Borsa Fotocamera" style="display:none;">
    <div class="dialog-btns">
        <button class="btn-cancel" onclick="closeModal('modal-section')">Annulla</button>
        <button class="btn-confirm" onclick="confirmAddSection()">Aggiungi</button>
    </div>
</dialog>

<!-- Modal Modifica Oggetto -->
<dialog id="modal-edit-item">
    <h3>Modifica Oggetto</h3>
    <label>Nome oggetto:</label>
    <input type="text" id="edit-item-name">
    
    <label>Sposta in:</label>
    <select id="edit-item-dest"></select>
    
    <div class="dialog-btns">
        <button class="btn-delete" onclick="deleteCurrentItem()">Elimina</button>
        <button class="btn-cancel" onclick="closeModal('modal-edit-item')">Annulla</button>
        <button class="btn-confirm" onclick="saveItemChanges()">Salva</button>
    </div>
</dialog>

<script>
   // --- DATABASE CLOUD ---
    const API_KEY = '$2a$10$rUwGPEN6MCGQIhbrf/In0OJkvcu3.owlrFizQtK2iEzdk/0Qmh.Le'; 
    const BIN_ID = '6a905e6bda38895dfe18ae9e';

    // SVG Icons
    const ICONS = {
        eye: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
        eyeOff: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`,
        trash: `<svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
        plus: `<svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`,
        chevron: `<svg class="svg-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>`,
        cart: `<svg class="svg-icon svg-mini" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>`,
        edit: `<svg class="svg-icon svg-mini" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
        grip: `<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;"><path d="M9 5a2 2 0 11-4 0 2 2 0 014 0zm0 7a2 2 0 11-4 0 2 2 0 014 0zm0 7a2 2 0 11-4 0 2 2 0 014 0zm10-14a2 2 0 11-4 0 2 2 0 014 0zm0 7a2 2 0 11-4 0 2 2 0 014 0zm0 7a2 2 0 11-4 0 2 2 0 014 0z"/></svg>`
    };

    // Struttura Dati Iniziale
    const defaultData = {
        "medioLungo": {
            name: "Viaggi medio lunghi (2 sett - 2 mesi)",
            sections: [
                {
                    title: "🎒 Zaino (Sotto il sedile)", hidden: false,
                    subsections: [
                        { name: "Elettronica e Documenti", collapsed: false, items: [{ name: "Computer con caricatore e mouse"},{ name: "Powerbank"},{ name: "Caricabatterie"},{ name: "Cuffiette"},{ name: "Documenti"},{ name: "Assicurazione sanitaria"},{ name: "Portafogli"},{ name: "Soldi valuta locale"}] },
                        { name: "Tasca ad Accesso Rapido", collapsed: false, items: [{ name: "Chiavi"},{ name: "Medicine"},{ name: "Borraccia"},{ name: "Occhiali"},{ name: "Occhiali da sole"},{ name: "Ombrello"},{ name: "Fazzoletti"}] },
                        { name: "Varie e Beauty Rapido", collapsed: false, items: [{ name: "Libro"},{ name: "Lucchetto"},{ name: "Spazzolino"},{ name: "Dentifricio"},{ name: "Burro cacao"},{ name: "Silviette umidificate e disinfettanti"}] }
                    ]
                },
                {
                    title: "🧳 Cabina (Vestiario Base)", hidden: false,
                    subsections: [
                        { name: "Fondo", collapsed: false, items: [{ name: "Scarpe da passeggio"},{ name: "Pantaloni"},{ name: "Bermuda"},{ name: "Felpa"},{ name: "Giacca a vento / giacca"}] },
                        { name: "Sopra", collapsed: false, items: [{ name: "Pigiama"},{ name: "Maglie"},{ name: "Polo/camice"},{ name: "Costume"}] },
                        { name: "Tasca e Incastri", collapsed: false, items: [{ name: "Panno in microfibra piccolo"},{ name: "Mutande"},{ name: "Calze"},{ name: "Cintura"}] }
                    ]
                },
                {
                    title: "🏔️ Stiva (Zaino Grande/Attrezzatura)", hidden: false,
                    subsections: [
                        { name: "Fondo", collapsed: false, items: [{ name: "Scarpe da lavoro"},{ name: "Ciabatte"},{ name: "Sacco a pelo"},{ name: "Materassino"},{ name: "Accappatoio"},{ name: "Asciugamani"},{ name: "Lenzuola"}] },
                        { name: "Sopra (Ingombranti)", collapsed: false, items: [{ name: "Federa"},{ name: "Pile/maglione pesante"}] },
                        { name: "Tasca / Beauty Case (Liquidi)", collapsed: false, items: [{ name: "Crema solare"},{ name: "Deodorante"},{ name: "Shampoo"},{ name: "Bagno schiuma"},{ name: "Prodotto per capelli"},{ name: "Taglia unghie"},{ name: "Rasoio"},{ name: "Phon"},{ name: "Sapone lavaggio a mano"}] },
                        { name: "Incastri / Lati", collapsed: false, items: [{ name: "Sacchetti per panni sporchi"},{ name: "Gavetta"},{ name: "Piccola ciabatta multipresa"}] }
                    ]
                }
            ]
        },
        "mare": {
            name: "Lista valigia mare",
            sections: [
                {
                    title: "🎒 Zaino", hidden: false,
                    subsections: [
                        { name: "Documenti e Tech", collapsed: false, items: [{ name: "Telefono"},{ name: "Caricabatterie"},{ name: "Powerbank"},{ name: "Cuffiette"},{ name: "Documenti"},{ name: "Portafogli"}] },
                        { name: "Accesso Rapido / Tasche", collapsed: false, items: [{ name: "Borraccia"},{ name: "Occhiali da sole"},{ name: "Occhiali"},{ name: "Chiavi"},{ name: "Medicine"}] },
                        { name: "Altro", collapsed: false, items: [{ name: "Libro"},{ name: "Taccuino"},{ name: "Pigiama"},{ name: "Rasoio"}] }
                    ]
                },
                {
                    title: "🧳 Valigia", hidden: false,
                    subsections: [
                        { name: "Fondo", collapsed: false, items: [{ name: "Scarpe"},{ name: "Infradito"},{ name: "Telo mare"},{ name: "Bermuda"},{ name: "Pantaloni"},{ name: "Felpa"},{ name: "Costumi"},{ name: "Accappatoio"},{ name: "Asciugamani"},{ name: "Lenzuola"}] },
                        { name: "Sopra", collapsed: false, items: [ { name: "Maglie"}, { name: "Polo/camicia"} ] },
                        { name: "Lato", collapsed: false, items: [ { name: "Cintura"} ] },
                        { name: "Tasca (Beauty e Intimo)", collapsed: false, items: [{ name: "Mutande"},{ name: "Calze"},{ name: "Crema solare"},{ name: "Deodorante"},{ name: "Shampoo"},{ name: "Phon"},{ name: "Spazzolino"},{ name: "Dentifricio"}] }
                    ]
                }
            ]
        }
    };

    let appData = {};
    let currentList = 'medioLungo';
    let editSecIdx = -1, editSubIdx = -1, editItemIdx = -1;
    let dragSrc = null;

    const statusEl = document.getElementById('sync-status');

    function setStatus(text, isLoading) {
        statusEl.innerHTML = isLoading ? `<span class="loader"></span> ${text}` : text;
    }

    // Assicura che i dati (anche finti) non facciano crashare il codice
    function normalizeData(data) {
        if (!data || !data.medioLungo || !data.medioLungo.sections) {
            return JSON.parse(JSON.stringify(defaultData));
        }
        Object.keys(data).forEach(listKey => {
            data[listKey].sections.forEach(sec => {
                if (sec.hidden === undefined) sec.hidden = false;
                if (!sec.subsections) sec.subsections = [];
                sec.subsections.forEach(sub => {
                    if (sub.collapsed === undefined) sub.collapsed = false;
                    if (!sub.items) sub.items = [];
                    sub.items.forEach(item => {
                        if (item.mise === undefined) item.mise = false;
                        if (item.valigia === undefined) item.valigia = false;
                        if (item.skip === undefined) item.skip = false;
                        if (item.toBuy === undefined) item.toBuy = false;
                    });
                });
            });
        });
        return data;
    }

    async function loadData() {
        let localData = normalizeData(JSON.parse(localStorage.getItem('valigiaAppFinalV2')));
        if(API_KEY.includes('INSERISCI_QUI')) {
            setStatus('⚠️ Modalità Offline', false);
            return localData;
        }

        setStatus('Sincronizzazione in corso...', true);
        try {
            // Aggiungo /latest per forzare la lettura corretta dell'ultima versione
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { 
                headers: { 'X-Master-Key': API_KEY } 
            });
            if(!res.ok) throw new Error('Fetch failed');
            
            const data = await res.json();
            
            // Se JSONBin ha restituito il finto file di inizializzazione, rigenera
            if (!data.record || !data.record.medioLungo) {
                console.log("Inizializzazione del Cloud forzata...");
                const initData = normalizeData(defaultData);
                await saveData(initData); 
                return initData;
            }
            
            setStatus('✅ Sincronizzato col Cloud', false);
            return normalizeData(data.record);
            
        } catch(e) {
            console.error(e);
            setStatus('❌ Errore Rete. Uso dati locali.', false);
            return localData;
        }
    }

    async function saveData(dataToSave = appData) {
        localStorage.setItem('valigiaAppFinalV2', JSON.stringify(dataToSave));
        if(!API_KEY.includes('INSERISCI_QUI')) {
            setStatus('Salvataggio...', true);
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'X-Master-Key': API_KEY,
                        'X-Bin-Versioning': 'false' // BLOCCA la creazione di mille copie in memoria!
                    },
                    body: JSON.stringify(dataToSave)
                });
                if(!res.ok) throw new Error('Upload failed');
                setStatus('✅ Salvato nel Cloud', false);
            } catch(e) {
                console.error(e);
                setStatus('❌ Errore salvataggio. Dati sul PC sicuri.', false);
            }
        }
    }

    function renderSelector() {
        const selector = document.getElementById('list-selector');
        selector.innerHTML = '';
        for (const [key, listObj] of Object.entries(appData)) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = listObj.name;
            if (key === currentList) opt.selected = true;
            selector.appendChild(opt);
        }
    }

    function switchList(listKey) { currentList = listKey; renderApp(); }

    async function toggleField(secIndex, subIndex, itemIndex, field) {
        let item = appData[currentList].sections[secIndex].subsections[subIndex].items[itemIndex];
        item[field] = !item[field];
        if (field === 'skip' && item.skip) { item.mise = false; item.valigia = false; } 
        else if ((field === 'mise' || field === 'valigia') && item[field]) { item.skip = false; }
        renderApp(); await saveData();
    }

    async function addItem(secIndex, subIndex) {
        let name = prompt("Nome nuovo oggetto:");
        if (name && name.trim() !== "") {
            appData[currentList].sections[secIndex].subsections[subIndex].items.push({ name: name.trim(), mise: false, valigia: false, skip: false, toBuy: false });
            renderApp(); await saveData();
        }
    }

    async function addSubsection(secIndex) {
        let name = prompt("Nome della nuova tasca/scomparto:");
        if (name && name.trim() !== "") {
            appData[currentList].sections[secIndex].subsections.push({ name: name.trim(), collapsed: false, items: [] });
            renderApp(); await saveData();
        }
    }

    async function toggleSectionHidden(secIndex) {
        appData[currentList].sections[secIndex].hidden = !appData[currentList].sections[secIndex].hidden;
        renderApp(); await saveData();
    }

    async function toggleSubsection(secIndex, subIndex) {
        appData[currentList].sections[secIndex].subsections[subIndex].collapsed = !appData[currentList].sections[secIndex].subsections[subIndex].collapsed;
        renderApp(); await saveData();
    }

    async function deleteSection(secIndex) {
        if(confirm("Eliminare definitivamente questo bagaglio?")) {
            appData[currentList].sections.splice(secIndex, 1);
            renderApp(); await saveData();
        }
    }

    // --- DRAG & DROP NATIVO HTML5 ---
    function handleDragStart(e, sec, sub, item) {
        dragSrc = {sec, sub, item};
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'drag'); // Richiesto da Firefox
        setTimeout(() => e.target.classList.add('dragging'), 0);
    }
    function handleDragEnd(e) {
        e.target.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        document.querySelectorAll('.drag-over-item').forEach(el => el.classList.remove('drag-over-item'));
    }
    function handleDragOverItem(e) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('drag-over-item');
    }
    function handleDragLeaveItem(e) {
        e.currentTarget.classList.remove('drag-over-item');
    }
    async function handleDropItem(e, targetSec, targetSub, targetItem) {
        e.preventDefault();
        e.stopPropagation();
        e.currentTarget.classList.remove('drag-over-item');
        if (!dragSrc) return;
        
        if (dragSrc.sec === targetSec && dragSrc.sub === targetSub && dragSrc.item === targetItem) return;

        const itemObj = appData[currentList].sections[dragSrc.sec].subsections[dragSrc.sub].items.splice(dragSrc.item, 1)[0];
        
        let insertIdx = targetItem;
        if (dragSrc.sec === targetSec && dragSrc.sub === targetSub && dragSrc.item < targetItem) { insertIdx -= 1; }
        
        appData[currentList].sections[targetSec].subsections[targetSub].items.splice(insertIdx, 0, itemObj);
        
        dragSrc = null;
        renderApp(); await saveData();
    }
    function handleDragOverArea(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('drag-over');
    }
    function handleDragLeaveArea(e) {
        if(e.currentTarget && e.relatedTarget && !e.currentTarget.contains(e.relatedTarget)) {
            e.currentTarget.classList.remove('drag-over');
        }
    }
    async function handleDropArea(e, targetSec, targetSub) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        if (!dragSrc) return;
        
        if (dragSrc.sec === targetSec && dragSrc.sub === targetSub) return; // Drop nello stesso posto già gestito da dropItem

        const itemObj = appData[currentList].sections[dragSrc.sec].subsections[dragSrc.sub].items.splice(dragSrc.item, 1)[0];
        appData[currentList].sections[targetSec].subsections[targetSub].items.push(itemObj);
        
        dragSrc = null;
        renderApp(); await saveData();
    }

    // --- MODALS ---
    function openSectionModal() {
        document.getElementById('new-sec-type').value = "🎒 Zaino";
        document.getElementById('new-sec-custom').style.display = 'none';
        document.getElementById('modal-section').showModal();
    }
    function checkCustomOption() {
        const type = document.getElementById('new-sec-type').value;
        document.getElementById('new-sec-custom').style.display = (type === 'altro') ? 'block' : 'none';
    }
    async function confirmAddSection() {
        const type = document.getElementById('new-sec-type').value;
        let name = type === 'altro' ? document.getElementById('new-sec-custom').value.trim() : type;
        if (name !== "") {
            appData[currentList].sections.push({ title: name, hidden: false, subsections: [{ name: "Scomparto Principale", collapsed: false, items: [] }] });
            closeModal('modal-section'); renderApp(); await saveData();
        }
    }
    function openEditModal(secIdx, subIdx, itemIdx) {
        editSecIdx = secIdx; editSubIdx = subIdx; editItemIdx = itemIdx;
        const item = appData[currentList].sections[secIdx].subsections[subIdx].items[itemIdx];
        document.getElementById('edit-item-name').value = item.name;
        
        const destSelect = document.getElementById('edit-item-dest');
        destSelect.innerHTML = '';
        appData[currentList].sections.forEach((sec, sIdx) => {
            const optGroup = document.createElement('optgroup');
            optGroup.label = sec.title;
            sec.subsections.forEach((sub, sbIdx) => {
                const opt = document.createElement('option');
                opt.value = `${sIdx}-${sbIdx}`;
                opt.textContent = sub.name;
                if(sIdx === secIdx && sbIdx === subIdx) opt.selected = true;
                optGroup.appendChild(opt);
            });
            destSelect.appendChild(optGroup);
        });
        document.getElementById('modal-edit-item').showModal();
    }
    async function saveItemChanges() {
        const newName = document.getElementById('edit-item-name').value.trim();
        if(!newName) return;
        const destVal = document.getElementById('edit-item-dest').value.split('-');
        const newSec = parseInt(destVal[0]), newSub = parseInt(destVal[1]);
        let itemObj = appData[currentList].sections[editSecIdx].subsections[editSubIdx].items[editItemIdx];
        itemObj.name = newName;
        if(newSec !== editSecIdx || newSub !== editSubIdx) {
            appData[currentList].sections[editSecIdx].subsections[editSubIdx].items.splice(editItemIdx, 1);
            appData[currentList].sections[newSec].subsections[newSub].items.push(itemObj);
        }
        closeModal('modal-edit-item'); renderApp(); await saveData();
    }
    async function deleteCurrentItem() {
        if(confirm("Vuoi davvero eliminare questo oggetto?")) {
            appData[currentList].sections[editSecIdx].subsections[editSubIdx].items.splice(editItemIdx, 1);
            closeModal('modal-edit-item'); renderApp(); await saveData();
        }
    }
    function closeModal(modalId) { document.getElementById(modalId).close(); }
    async function resetCurrentList() {
        if(confirm("Vuoi azzerare le spunte (Mise/Valigia/No/Compra) di TUTTI gli oggetti in questo scenario?")) {
            appData[currentList].sections.forEach(sec => sec.subsections.forEach(sub => sub.items.forEach(item => { item.mise = false; item.valigia = false; item.skip = false; item.toBuy = false; })));
            renderApp(); await saveData();
        }
    }

    // --- RENDER APP ---
    function renderApp() {
        const root = document.getElementById('app-root');
        root.innerHTML = '';
        const sectionsData = appData[currentList].sections;

        if(sectionsData.length === 0) {
            root.innerHTML = '<p style="text-align:center; color:#888;">Nessun bagaglio presente. Aggiungine uno!</p>';
            return;
        }

        let toBuyItems = []; // Raccoglitore lista della spesa

        sectionsData.forEach((section, sIndex) => {
            const secDiv = document.createElement('div');
            secDiv.className = `section ${section.hidden ? 'hidden-sec' : ''}`;
            
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = `
                <span>${section.title}</span>
                <div class="sec-actions">
                    <button class="icon-btn" title="Aggiungi Tasca/Scomparto" onclick="addSubsection(${sIndex})">${ICONS.plus}</button>
                    <button class="icon-btn" title="Mostra/Nascondi Bagaglio" onclick="toggleSectionHidden(${sIndex})">${section.hidden ? ICONS.eyeOff : ICONS.eye}</button>
                    <button class="icon-btn danger" title="Elimina Bagaglio" onclick="deleteSection(${sIndex})">${ICONS.trash}</button>
                </div>
            `;
            secDiv.appendChild(header);

            const body = document.createElement('div');
            body.className = 'section-body';
            let missingItems = [];

            section.subsections.forEach((sub, subIndex) => {
                const subDiv = document.createElement('div');
                subDiv.className = `subsection ${sub.collapsed ? 'collapsed' : ''}`;
                
                const subHeader = document.createElement('div');
                subHeader.className = 'subsection-header';
                subHeader.onclick = () => toggleSubsection(sIndex, subIndex);
                subHeader.innerHTML = `
                    <div class="subsection-title">📍 ${sub.name}</div>
                    <div class="subsection-toggle">${ICONS.chevron}</div>
                `;
                subDiv.appendChild(subHeader);

                const subBody = document.createElement('div');
                subBody.className = 'subsection-body';
                subBody.ondragover = handleDragOverArea;
                subBody.ondragleave = handleDragLeaveArea;
                subBody.ondrop = (e) => handleDropArea(e, sIndex, subIndex);

                sub.items.forEach((item, iIndex) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item';
                    
                    // Impostazioni Drag & Drop Native sull'oggetto
                    itemDiv.setAttribute('draggable', 'true');
                    itemDiv.ondragstart = (e) => handleDragStart(e, sIndex, subIndex, iIndex);
                    itemDiv.ondragend = handleDragEnd;
                    itemDiv.ondragover = handleDragOverItem;
                    itemDiv.ondragleave = handleDragLeaveItem;
                    itemDiv.ondrop = (e) => handleDropItem(e, sIndex, subIndex, iIndex);

                    if (item.skip) itemDiv.classList.add('status-skip');
                    else if (item.valigia) itemDiv.classList.add('status-valigia');
                    else if (item.mise) itemDiv.classList.add('status-mise');
                    else if (item.toBuy) itemDiv.classList.add('status-buy');

                    if (!item.skip && !item.valigia) missingItems.push(item.name);
                    
                    // Aggiungi alla lista "da comprare" se flaggato
                    if (item.toBuy) {
                        toBuyItems.push({ name: item.name, location: `${section.title.split(' (')[0]} - ${sub.name}` });
                    }

                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'item-header';
                    
                    const dragDiv = document.createElement('div');
                    dragDiv.className = 'drag-handle';
                    dragDiv.innerHTML = ICONS.grip;
                    
                    const nameArea = document.createElement('div');
                    nameArea.className = 'item-name-area';
                    let nameHtml = `<div class="item-name">${item.name}</div>`;
                    if (item.toBuy) nameHtml += `<div class="badge-buy">🛒 Da Comprare</div>`;
                    nameArea.innerHTML = nameHtml;

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'item-actions';
                    actionsDiv.innerHTML = `
                        <button class="action-btn ${item.toBuy ? 'active-buy' : ''}" title="Da Comprare" onclick="toggleField(${sIndex}, ${subIndex}, ${iIndex}, 'toBuy')">${ICONS.cart}</button>
                        <button class="action-btn" title="Modifica" onclick="openEditModal(${sIndex}, ${subIndex}, ${iIndex})">${ICONS.edit}</button>
                    `;
                    
                    headerDiv.appendChild(dragDiv);
                    headerDiv.appendChild(nameArea);
                    headerDiv.appendChild(actionsDiv);

                    // Controlli Checkbox (Senza Testo)
                    const controlsDiv = document.createElement('div');
                    controlsDiv.className = 'controls';
                    controlsDiv.innerHTML = `
                        <label class="control-label" title="Mise en place">
                            <input type="checkbox" ${item.mise ? 'checked' : ''} onchange="toggleField(${sIndex}, ${subIndex}, ${iIndex}, 'mise')">📦
                        </label>
                        <label class="control-label" title="In Valigia">
                            <input type="checkbox" ${item.valigia ? 'checked' : ''} onchange="toggleField(${sIndex}, ${subIndex}, ${iIndex}, 'valigia')">🧳
                        </label>
                        <label class="control-label" title="Non Serve">
                            <input type="checkbox" ${item.skip ? 'checked' : ''} onchange="toggleField(${sIndex}, ${subIndex}, ${iIndex}, 'skip')">❌
                        </label>
                    `;
                    
                    itemDiv.appendChild(headerDiv);
                    itemDiv.appendChild(controlsDiv);
                    subBody.appendChild(itemDiv);
                });

                const addBtn = document.createElement('button');
                addBtn.className = 'btn-add-item';
                addBtn.textContent = '+ Aggiungi oggetto in questa tasca...';
                addBtn.onclick = () => addItem(sIndex, subIndex);
                subBody.appendChild(addBtn);

                subDiv.appendChild(subBody);
                body.appendChild(subDiv);
            });

            const summaryDiv = document.createElement('div');
            if(missingItems.length > 0) {
                summaryDiv.className = 'missing-summary';
                summaryDiv.innerHTML = `<strong>Ancora fuori dalla valigia:</strong> ${missingItems.join(', ')}`;
            } else {
                summaryDiv.className = 'missing-summary missing-summary-ok';
                summaryDiv.innerHTML = `<strong>✅ Tutto dentro!</strong> Bagaglio completo e pronto.`;
            }
            body.appendChild(summaryDiv);

            secDiv.appendChild(body);
            root.appendChild(secDiv);
        });

        // Appendi Sezione "Da Comprare" alla fine (se ci sono oggetti)
        if (toBuyItems.length > 0) {
            const buyContainer = document.createElement('div');
            buyContainer.className = 'to-buy-summary';
            buyContainer.innerHTML = `
                <div class="section-header">
                    <span>${ICONS.cart} Lista della Spesa</span>
                </div>
                <ul class="to-buy-list">
                    ${toBuyItems.map(i => `<li><strong>${i.name}</strong> <span style="color:var(--text-muted); font-size: 0.85em;">(Destinazione: ${i.location})</span></li>`).join('')}
                </ul>
            `;
            root.appendChild(buyContainer);
        }
    }

    async function init() {
        appData = await loadData();
        renderSelector();
        renderApp();
        document.getElementById('footer').style.display = 'flex';
    }

    init();
</script>

</body>
</html>
